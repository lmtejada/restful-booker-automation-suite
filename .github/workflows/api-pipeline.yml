name: API Pipeline

on:
    push:
        branches: [main]

jobs:
    api-pipeline:
        name: Newman + Playwright + Allure
        timeout-minutes: 60
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.22.3
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci

            # Cheapest, fastest check — gates the rest of the pipeline on basic API
            # reachability before spending minutes on the full Playwright suite
            - name: Run Newman (Postman collection)
              id: newman
              run: |
                  npx newman run src/collections/restful-booker.postman_collection.json \
                    -e src/collections/environment.template.json \
                    --env-var "baseUrl=${{ vars.API_URL }}" \
                    --env-var "admin_username=${{ secrets.ADMIN_USERNAME }}" \
                    --env-var "admin_password=${{ secrets.ADMIN_PASSWORD }}" \
                    -r cli,htmlextra,allure \
                    --reporter-htmlextra-export reports/newman/report.html \
                    --reporter-allure-resultsDir reports/allure-results

            - name: Run Playwright tests
              id: run-playwright
              run: npm run test:api-suite
              env:
                  API_URL: ${{ vars.API_URL }}
                  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

            # Separate from the step above so a contract break is visible on its own,
            # not buried in the main suite's pass/fail. Same playwright.config.ts, so
            # results land in the same reports/allure-results dir either way.
            - name: Run Pact contract tests
              id: run-contract
              run: npm run test:contract
              env:
                  API_URL: ${{ vars.API_URL }}
                  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

            - name: Upload Newman report artifact
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: newman-report
                  path: reports/newman/
                  retention-days: 30

            # Gated on Newman having run, not Playwright — Newman's own results now
            # feed reports/allure-results too, so a report is still worth generating
            # (showing Newman's failure) even when it blocked Playwright from running
            - name: Generate Allure report
              if: ${{ !cancelled() && steps.newman.outcome != 'skipped' }}
              run: npm run allure:generate

            - name: Upload Allure report artifact
              if: ${{ !cancelled() && steps.newman.outcome != 'skipped' }}
              uses: actions/upload-artifact@v4
              with:
                  name: allure-report
                  path: reports/allure-report/
                  retention-days: 30

            # report/<run_number>/ is archived per run so history survives; the gh-pages
            # root index.html *is* the history page and lists them newest-first.
            # Only the last REPORT_HISTORY_LIMIT runs are kept
            - name: Checkout gh-pages
              if: ${{ !cancelled() && steps.newman.outcome != 'skipped' }}
              uses: actions/checkout@v4
              with:
                  ref: gh-pages
                  path: gh-pages

            - name: Archive report and update history index
              id: publish-history
              if: ${{ !cancelled() && steps.newman.outcome != 'skipped' }}
              env:
                  REPORT_HISTORY_LIMIT: 20
                  # Copies this run's Allure report into report/<run_number>/ on the gh-pages
                  # branch, prunes runs beyond REPORT_HISTORY_LIMIT, regenerates the root
                  # index.html with links to all retained runs (newest first, newest marked
                  # "Latest"), then commits and pushes, skipping the commit if nothing changed
              run: |
                  set -euo pipefail
                  cd gh-pages
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  RUN_DIR="report/${{ github.run_number }}"
                  rm -rf "$RUN_DIR"
                  mkdir -p "$RUN_DIR"
                  cp -r ../reports/allure-report/. "$RUN_DIR"/

                  # Prune runs beyond the retention limit (newest dirs first).
                  (cd report && ls -1dt */ 2>/dev/null | tail -n +$((REPORT_HISTORY_LIMIT + 1)) | xargs -r rm -rf)

                  {
                      echo '<!DOCTYPE html>'
                      echo '<html lang="en">'
                      echo '<head>'
                      echo '<meta charset="utf-8">'
                      echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
                      echo '<title>Restful Booker Automation Suite — Report History</title>'
                      echo '<style>'
                      echo ':root { color-scheme: light dark; }'
                      echo 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1.5rem; line-height: 1.5; color: #1a1a1a; background: #fff; }'
                      echo 'h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }'
                      echo 'p.subtitle { color: #57606a; margin-top: 0; margin-bottom: 2rem; }'
                      echo 'ul.runs { list-style: none; padding: 0; margin: 0; border: 1px solid #e2e2e2; border-radius: 8px; overflow: hidden; }'
                      echo 'ul.runs li { border-bottom: 1px solid #e2e2e2; }'
                      echo 'ul.runs li:last-child { border-bottom: none; }'
                      echo 'ul.runs a { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.2rem; text-decoration: none; color: #1a1a1a; transition: background 0.15s ease; }'
                      echo 'ul.runs a:hover { background: #f6f8fa; }'
                      echo '.badge { font-size: 0.75rem; font-weight: 600; color: #1a7f37; background: #dafbe1; padding: 0.15rem 0.5rem; border-radius: 999px; }'
                      echo '@media (prefers-color-scheme: dark) {'
                      echo '  body { background: #0d1117; color: #e6edf3; }'
                      echo '  p.subtitle { color: #9198a1; }'
                      echo '  ul.runs { border-color: #30363d; }'
                      echo '  ul.runs li { border-color: #30363d; }'
                      echo '  ul.runs a { color: #e6edf3; }'
                      echo '  ul.runs a:hover { background: #161b22; }'
                      echo '  .badge { color: #3fb950; background: #033a16; }'
                      echo '}'
                      echo '</style>'
                      echo '</head>'
                      echo '<body>'
                      echo '<h1>Restful Booker Automation Suite</h1>'
                      echo '<p class="subtitle">Allure report history — Newman + Playwright results, published by <code>api-pipeline.yml</code> on every push to <code>main</code>. Last 20 runs kept.</p>'
                      echo '<ul class="runs">'

                      first=true
                      for d in $(cd report && ls -1dt */ | sed 's#/##'); do
                          if [ "$first" = true ]; then
                              echo "<li><a href=\"report/$d/\">Run $d <span class=\"badge\">Latest</span></a></li>"
                              first=false
                          else
                              echo "<li><a href=\"report/$d/\">Run $d</a></li>"
                          fi
                      done

                      echo '</ul></body></html>'
                  } >index.html

                  git add report index.html
                  if git diff --cached --quiet; then
                      echo "No report changes to commit"
                  else
                      git commit -m "Publish Allure report for run ${{ github.run_number }}"
                      git push
                  fi

            # Chained to the publish step's own outcome, not just !cancelled(), so a failed
            # push (e.g. a gh-pages race) doesn't print a link to a report that isn't there
            - name: Summarize report URL
              if: ${{ !cancelled() && steps.publish-history.outcome == 'success' }}
              run: |
                  echo "📊 [View this run's Allure report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/report/${{ github.run_number }}/)" >> "$GITHUB_STEP_SUMMARY"
                  echo "🗂️ [Report history](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> "$GITHUB_STEP_SUMMARY"
