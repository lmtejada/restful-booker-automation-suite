<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restful Booker Automation Suite — Report History</title>
<style>
:root { color-scheme: light dark; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1.5rem; line-height: 1.5; color: #1a1a1a; background: #fff; }
h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
p.subtitle { color: #57606a; margin-top: 0; margin-bottom: 2rem; }
ul.runs { list-style: none; padding: 0; margin: 0; border: 1px solid #e2e2e2; border-radius: 8px; overflow: hidden; }
ul.runs li { border-bottom: 1px solid #e2e2e2; }
ul.runs li:last-child { border-bottom: none; }
ul.runs a { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.2rem; text-decoration: none; color: #1a1a1a; transition: background 0.15s ease; }
ul.runs a:hover { background: #f6f8fa; }
.badge { font-size: 0.75rem; font-weight: 600; color: #1a7f37; background: #dafbe1; padding: 0.15rem 0.5rem; border-radius: 999px; }
@media (prefers-color-scheme: dark) {
  body { background: #0d1117; color: #e6edf3; }
  p.subtitle { color: #9198a1; }
  ul.runs { border-color: #30363d; }
  ul.runs li { border-color: #30363d; }
  ul.runs a { color: #e6edf3; }
  ul.runs a:hover { background: #161b22; }
  .badge { color: #3fb950; background: #033a16; }
}
</style>
</head>

<h1>Restful Booker Automation Suite</h1>
